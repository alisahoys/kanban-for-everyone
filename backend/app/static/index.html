<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM Backend</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4efe9;
        color: #2f2430;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        border: 1px solid #e7d8cf;
        border-radius: 16px;
        padding: 2rem 3rem;
        box-shadow: 0 12px 30px rgba(46, 25, 31, 0.08);
      }
      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello from the PM backend</h1>
      <p>The FastAPI scaffolding is running successfully.</p>
    </main>
  </body>
</html>
